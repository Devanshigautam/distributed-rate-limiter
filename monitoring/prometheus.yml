# Scrape every running copy of "app" every 5 seconds.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ratelimiter
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ app ]          # Docker DNS returns one address per copy (--scale app=3 -> 3 targets)
        type: A
        port: 8080
        refresh_interval: 10s
