services:
  # Always started: `docker compose up -d`
  redis:
    image: redis:7
    container_name: rl-redis
    ports:
      - "6379:6379"

  # ---- "cluster" profile: docker compose --profile cluster up -d --build --scale app=3 ----
  app:
    profiles: [ cluster ]
    build: .
    environment:
      SPRING_DATA_REDIS_HOST: redis      # every copy talks to the SAME Redis
    mem_limit: 384m
    depends_on:
      - redis

  lb:
    profiles: [ cluster ]
    image: nginx:1.27-alpine
    ports:
      - "8000:80"                        # send requests to http://localhost:8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  prometheus:                            # collects metrics from every app copy
    profiles: [ cluster ]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"                      # http://localhost:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m
    depends_on:
      - app

  grafana:                               # draws the dashboard
    profiles: [ cluster ]
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"                      # http://localhost:3000 (no login needed)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    depends_on:
      - prometheus

  # ---- "load" profile: docker compose --profile cluster --profile load run --rm k6 ----
  k6:                                    # sends steady traffic through Nginx for 2 minutes
    profiles: [ load ]
    image: grafana/k6:1.3.0
    volumes:
      - ./load-tests:/scripts:ro
    command: run /scripts/traffic.js
