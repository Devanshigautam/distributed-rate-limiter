# Load balancer: spreads requests round-robin across every running copy of "app".
events {}

http {
    upstream ratelimiter {
        server app:8080;    # Docker DNS returns one address per copy (--scale app=3 -> 3 addresses)
    }

    server {
        listen 80;
        location / {
            proxy_pass http://ratelimiter;
        }
    }
}
